<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting — SpeakPass</title>
  <meta http-equiv="refresh" content="0;url=./legal.html#terms" />
  <link rel="canonical" href="./legal.html#terms" />
  <script>
    (function () {
      var dest = "./legal.html#terms";
      try { window.location.replace(dest); } catch (e) { window.location.href = dest; }
    })();
  </script>
</head>
<body>
  <p>Moved to <a href="./legal.html#terms">legal.html#terms</a>.</p>
</body>
</html>
